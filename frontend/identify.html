<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Decorator — หาสินค้าจากรูป</title>
<link rel="icon" href="/static/icon.ico">
<link rel="stylesheet" href="/static/styles/tokens.css?v=8.41">
<link rel="stylesheet" href="/static/styles/components.css?v=8.41">
<script src="/static/theme.js?v=8.41"></script>
<script src="/static/sidebar.js?v=8.41"></script>
</head>
<body>

<header class="topbar">
  <span class="logo">Tree Decorator</span>
  <span class="spacer"></span>
  <div class="tile">
    <span class="k caption">สร้างไปแล้ว</span>
    <span class="v" id="generations">–</span>
  </div>
  <div class="tile">
    <span class="k caption">token ที่ใช้</span>
    <span class="v" id="tokens">–</span>
  </div>
</header>

<div class="frame">
  <nav class="sidebar">
    <button type="button" class="row" id="sidebar-toggle">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></span>
      ย่อเมนู
    </button>
    <a class="row" href="/">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
      หน้าแรก
    </a>
    <a class="row active" href="/identify">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg></span>
      หาสินค้าจากรูป
    </a>
    <a class="row" href="/history">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
      ประวัติ
    </a>
    <a class="row" href="/pricing">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.82 0l4.6-4.6a2 2 0 0 0 0-2.82z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
      ตั้งราคา
    </a>
    <a class="row" href="/settings">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></span>
      ตั้งค่า
    </a>
  </nav>

  <main class="page">
    <div class="settings-columns">

      <div class="stack">
        <section class="card stack">
          <span class="section-title">หาสินค้าจากรูป</span>
          <span class="hint">อัปโหลดรูปที่มีของตกแต่งอยู่แล้ว เพื่อค้นแคตตาล็อกว่ามีอะไรใกล้เคียง</span>
          <div class="notice" id="error-box" hidden></div>
          <input class="input" id="identify-tree-code" list="identify-tree-code-list" autocomplete="off"
                 placeholder="รหัสต้น — ไม่ใส่ก็ได้ ใส่แล้วจะบอกจำนวนของที่ควรใช้บนต้นนี้ด้วย">
          <datalist id="identify-tree-code-list"></datalist>
          <span class="hint" id="identify-tree-code-hint"></span>
          <div class="identify-columns">
            <div class="stack">
              <input class="input" type="file" id="identify-reference-file" accept="image/jpeg,image/png">
              <div class="btn-row" id="identify-reference-actions" hidden>
                <button class="btn" id="identify-btn">หาว่าในรูปมีของอะไรที่เราขาย</button>
                <button class="btn danger" id="identify-reference-clear">เอารูปออก</button>
              </div>
            </div>
            <div class="stack">
              <img class="thumb-sm" id="identify-reference-preview" alt="รูปอ้างอิงหาสินค้า" hidden>
            </div>
          </div>
        </section>
      </div>

      <div class="stack">
        <section class="card stack" id="identify-panel" hidden>
          <span class="section-title">ของในรูปที่เราขาย</span>
          <div class="notice" id="identify-note" hidden></div>
          <div class="stack" id="identify-results"></div>
        </section>
      </div>

    </div>
  </main>
</div>

<!-- Full-size look at one photo, opened from the small corner button on a .candidate card. -->
<dialog id="lightbox-dialog" class="lightbox-dialog">
  <button class="btn danger" id="lightbox-close">ปิด</button>
  <img id="lightbox-image" alt="">
</dialog>

<script src="/static/api.js?v=8.41"></script>
<script src="/static/identify.js?v=8.41"></script>
</body>
</html>
