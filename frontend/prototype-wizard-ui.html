<meta charset="utf-8">
<title>Wizard Prototype — 3 Variants</title>
<!-- PROTOTYPE — throwaway. Answers wayfinder ticket #3 "หน้าตา + flow ของ wizard 3 ขั้น".
     Three structurally different takes on the ไซส์→งบ→แนว flow that feeds into the existing
     "Auto ตามโทน" mode (mocked up separately at the v2 mockup artifact). Switch via ?variant=
     or the floating bar at the bottom. Not meant to survive past this decision. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Bai+Jamjuree:wght@400;600;700&family=Inter:wght@400;500;600&family=Anuphan:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --surface-0:#F7F1E8; --surface-1:#FFFFFF; --border:rgba(0,0,0,.06);
    --text-primary:#2E2A22; --text-muted:#796D5B;
    --fill-primary:#7A2E2E; --on-primary:#FFFFFF;
    --fill-success:#2E4A3B; --text-success:#2E4A3B;
    --fill-gold-block:#B08D57; --text-gold:#7A5A1E;
    --btn-primary-bg:#7A2E2E; --btn-primary-bg-hover:#651F1F;
    --btn-primary-bg-disabled:#D9C3C1; --btn-primary-text:#FFFFFF; --btn-primary-text-disabled:#F7F1E8;
    --btn-secondary-border:#D9B0AC; --btn-secondary-text:#7A2E2E; --btn-secondary-bg-hover:#F7ECE9;
    --btn-ghost-border:rgba(0,0,0,.1); --btn-ghost-text:#8A7D68; --btn-ghost-bg-hover:rgba(0,0,0,.03);
    --state-warning-bg:#FBF3E4; --state-warning-border:#D9B877; --state-warning-text:#6B4E1A;
    --modal-item-selected-bg:#F7ECE9; --modal-item-selected-text:#7A2E2E;
    --thumb-code-bg:rgba(0,0,0,.65); --thumb-code-text:#FFFFFF;
    --focus-ring-gap:#FFFFFF; --focus-ring-color:#2E2A22;
    --font-header-en:"Fraunces",Georgia,serif; --font-body-en:"Inter",-apple-system,sans-serif;
    --font-heading:"Bai Jamjuree","Inter",sans-serif; --font-th:"Anuphan","Inter",sans-serif;
    --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-full:999px;
    --shadow:0 1px 2px rgba(46,42,34,.08); --shadow-hover:0 4px 10px rgba(122,46,46,.2);
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px;
    --text-xs:11px; --text-sm:12px; --text-base:14px; --text-lg:16px; --text-md:18px; --text-xl:20px; --text-2xl:26px;
    --transition-gentle:200ms ease-out;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{background:var(--surface-0)}
  body{margin:0;color:var(--text-primary);font-family:var(--font-th);font-weight:400;font-size:var(--text-base);line-height:1.5}
  [hidden]{display:none!important}
  :focus-visible{box-shadow:0 0 0 2px var(--focus-ring-gap),0 0 0 4px var(--focus-ring-color);outline:none}

  .logo{font-family:var(--font-header-en);font-weight:600;font-size:var(--text-2xl);letter-spacing:-.01em}
  .caption{font-family:var(--font-heading);font-size:var(--text-sm);font-weight:600;color:var(--text-muted)}
  .panel-title{font-family:var(--font-heading);font-size:var(--text-md);font-weight:600;color:var(--text-primary)}
  .section-title{font-family:var(--font-heading);font-size:var(--text-lg);font-weight:600;color:var(--text-muted)}
  .hint{font-size:var(--text-sm);color:var(--text-muted)}

  .btn{background:transparent;border:none;border-radius:var(--radius-sm);color:var(--text-primary);
    padding:var(--space-2) var(--space-4);font:inherit;font-size:var(--text-base);cursor:pointer;
    box-shadow:var(--shadow);transition:background var(--transition-gentle),transform var(--transition-gentle)}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover)}
  .btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
  .btn.primary{background:var(--btn-primary-bg);color:var(--btn-primary-text)}
  .btn.primary:hover{background:var(--btn-primary-bg-hover)}
  .btn.primary:disabled{background:var(--btn-primary-bg-disabled);color:var(--btn-primary-text-disabled)}
  .btn:not(.primary){border:1px solid var(--btn-ghost-border);color:var(--btn-ghost-text)}
  .btn:not(.primary):hover{background:var(--btn-ghost-bg-hover)}

  .input{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text-primary);padding:var(--space-2) var(--space-3);font:inherit;font-size:var(--text-sm)}

  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:var(--space-4);box-shadow:var(--shadow)}

  .topbar{height:64px;display:flex;align-items:center;gap:var(--space-6);padding:0 var(--space-6);
    background:var(--surface-1);border-bottom:1px solid var(--border)}
  .topbar .spacer{flex:1}
  .frame{display:flex;align-items:flex-start}
  .sidebar{position:sticky;top:0;width:220px;flex:none;padding:var(--space-6) var(--space-3);
    border-right:1px solid var(--border);background:var(--surface-1);min-height:calc(100vh - 64px)}
  .row{display:flex;align-items:center;gap:var(--space-2);width:100%;text-align:left;border:none;
    background:none;color:inherit;font:inherit;font-family:var(--font-heading);font-size:var(--text-base);
    padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);text-decoration:none}
  .row.active{background:var(--modal-item-selected-bg);color:var(--modal-item-selected-text)}
  .row-icon svg{width:18px;height:18px}
  .page{padding:var(--space-6) var(--space-6) 120px;flex:1;min-width:0;max-width:1040px;margin:0 auto}

  .chip-select{display:flex;gap:var(--space-2);flex-wrap:wrap}
  .chip-select button{border:1.5px solid var(--border);background:var(--surface-1);border-radius:var(--radius-md);
    padding:var(--space-2) var(--space-3);cursor:pointer;font:inherit;font-size:var(--text-sm);
    display:flex;align-items:center;gap:6px;transition:border-color var(--transition-gentle)}
  .chip-select button[aria-pressed="true"]{border-color:var(--fill-primary);background:var(--modal-item-selected-bg);color:var(--fill-primary);font-weight:600}
  .chip-select button svg{width:16px;height:16px}

  /* ---- prototype-only chrome: clearly not part of the design being judged ---- */
  .proto-banner{background:#2E2A22;color:#F2ECE4;font-family:var(--font-body-en);font-size:12px;
    text-align:center;padding:6px;letter-spacing:.02em}
  .proto-banner b{color:#E8B44A}
  .switcher{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;
    display:flex;align-items:center;gap:2px;background:#2E2A22;color:#F2ECE4;border-radius:var(--radius-full);
    padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-family:var(--font-body-en)}
  .switcher button{background:transparent;border:none;color:#F2ECE4;width:30px;height:30px;border-radius:50%;
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .switcher button:hover{background:rgba(255,255,255,.12)}
  .switcher .label{font-size:12.5px;font-weight:600;padding:0 10px;white-space:nowrap}
  .switcher .label small{display:block;font-weight:400;opacity:.65;font-size:10.5px}

  /* ============ VARIANT A — stepper ============ */
  .stepper-progress{display:flex;align-items:center;gap:0;margin-bottom:var(--space-6)}
  .stepper-progress .seg{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
  .stepper-progress .seg:not(:last-child)::after{content:"";position:absolute;top:13px;left:56%;width:88%;height:2px;background:var(--border)}
  .stepper-progress .seg.done:not(:last-child)::after{background:var(--fill-success)}
  .stepper-progress .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:var(--surface-1);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-muted);z-index:1}
  .stepper-progress .seg.current .dot{border-color:var(--fill-primary);color:var(--fill-primary)}
  .stepper-progress .seg.done .dot{border-color:var(--fill-success);background:var(--fill-success);color:#fff}
  .stepper-progress .seg-label{font-size:11.5px;font-family:var(--font-heading);font-weight:600;color:var(--text-muted)}
  .stepper-progress .seg.current .seg-label{color:var(--text-primary)}
  .stepper-card{max-width:520px;margin:0 auto;text-align:center;padding:var(--space-6)}
  .stepper-card h2{font-family:var(--font-heading);font-size:var(--text-xl);margin:0 0 4px}
  .stepper-card .chip-select{justify-content:center;margin-top:var(--space-4)}
  .stepper-nav{display:flex;justify-content:space-between;max-width:520px;margin:var(--space-6) auto 0}

  /* ============ VARIANT B — single filter panel ============ */
  .panel-grid{display:grid;grid-template-columns:340px 1fr;gap:var(--space-6);align-items:start}
  @media (max-width:800px){.panel-grid{grid-template-columns:1fr}}
  .filter-field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--space-4)}
  .filter-field label{font-family:var(--font-heading);font-size:var(--text-sm);font-weight:600;color:var(--text-muted)}
  .range-row{display:flex;align-items:center;gap:8px}
  .range-row .input{width:100px}
  .checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .checkbox-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:6px 8px;font-size:var(--text-sm);cursor:pointer}
  .checkbox-chip.checked{border-color:var(--fill-gold-block);background:#FBF3E4}
  .live-count{font-family:var(--font-header-en);font-size:34px;color:var(--fill-primary);line-height:1}
  .result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-top:var(--space-3)}
  .result-item{display:flex;flex-direction:column;align-items:center;gap:3px}
  .result-item .box{width:100%;aspect-ratio:1;border-radius:var(--radius-sm);border:1px solid var(--border);
    background:var(--surface-0);display:flex;align-items:center;justify-content:center}
  .result-item .price{font-size:9.5px;color:var(--text-muted);font-family:var(--font-body-en)}

  /* ============ VARIANT C — conversational assistant ============ */
  .convo-grid{display:grid;grid-template-columns:1fr 300px;gap:var(--space-6);align-items:start}
  @media (max-width:800px){.convo-grid{grid-template-columns:1fr}}
  .convo-thread{display:flex;flex-direction:column;gap:var(--space-3);min-height:360px}
  .bubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:var(--text-sm)}
  .bubble.assistant{align-self:flex-start;background:var(--surface-1);border:1px solid var(--border);border-bottom-left-radius:4px}
  .bubble.user{align-self:flex-end;background:var(--fill-primary);color:#fff;border-bottom-right-radius:4px}
  .convo-input-row{display:flex;gap:var(--space-2);margin-top:var(--space-2)}
  .convo-input-row .chip-select{flex:1}
  .receipt{position:sticky;top:var(--space-6)}
  .receipt-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:var(--text-sm)}
  .receipt-row:last-child{border-bottom:none}
  .receipt-row .v{font-family:var(--font-body-en);color:var(--text-primary);font-weight:600}
  .receipt-row .v.pending{color:var(--text-muted);font-weight:400;font-style:italic}
</style>

<div class="proto-banner">🧪 PROTOTYPE — <b>ticket #3</b>: หน้าตา wizard ไซส์→งบ→แนว — throwaway, ไม่เอาโค้ดนี้ขึ้น production</div>

<header class="topbar">
  <span class="logo">Tree Decorator</span>
  <span class="spacer"></span>
  <span class="caption" id="variant-caption"></span>
</header>

<div class="frame">
  <nav class="sidebar" style="display:flex;flex-direction:column;gap:4px">
    <a class="row active" href="#"><span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>หน้าแรก</a>
    <a class="row" href="#"><span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg></span>หาสินค้าจากรูป</a>
    <a class="row" href="#"><span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>ประวัติ</a>
  </nav>

  <main class="page" id="page-root"></main>
</div>

<div class="switcher" id="switcher"></div>

<script>
// ---------------------------------------------------------------- shared data
const SIZES = [
  {key:'4ft', label:'4 Ft.', mm:1219},
  {key:'5ft', label:'5 Ft.', mm:1524},
  {key:'6ft', label:'6 Ft.', mm:1829},
  {key:'7ft', label:'7 Ft.', mm:2134},
  {key:'8ft', label:'8 Ft.', mm:2438},
];
const ICONS = {
  ball:  `<circle cx="12" cy="13" r="7"/><path d="M10 3h4l-1 3h-2z"/>`,
  spray: `<path d="M12 21V7M12 7c0-3 2-4.5 4.5-4.5M12 7c0-3-2-4.5-4.5-4.5M8 12c-2-1-4.5 0-6 1.5M16 12c2-1 4.5 0 6 1.5"/>`,
  bell:  `<path d="M7 17h10a4 6.5 0 0 1-10 0Z"/><path d="M12 4v2"/><path d="M12 6c-3.5 0-6 3-6 6.5V17h12v-4.5C18 9 15.5 6 12 6Z"/>`,
  star:  `<path d="M12 2 14.6 8.8 22 9.6 16.5 14.2 18.2 21.4 12 17.6 5.8 21.4 7.5 14.2 2 9.6 9.4 8.8Z"/>`,
  gift:  `<rect x="4" y="10" width="16" height="10" rx="1"/><path d="M4 14h16M12 10v10"/><path d="M8 10c0-3 2-5 4-5s4 2 4 5"/>`,
  spark: `<path d="M12 3v6M12 15v6M3 12h6M15 12h6M6 6l3 3M18 18l-3-3M18 6l-3 3M6 18l3-3"/>`,
};
function icon(kind, color, size=18){
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[kind]}</svg>`;
}
const CATEGORIES = [
  {key:'ornament', label:'เน้นบอล',        kind:'ball'},
  {key:'flower',   label:'เน้นดอก/ช่อ',    kind:'spray'},
  {key:'bell',     label:'เน้นระฆัง',      kind:'bell'},
  {key:'topper',   label:'เน้นดาว/ยอด',    kind:'star'},
  {key:'giftbox',  label:'เน้นกล่องของขวัญ', kind:'gift'},
  {key:'light',    label:'เน้นไฟ/ประกาย',  kind:'spark'},
];
// mock pool standing in for catalog.py's category_of() + price — 30 items, ~6 per category,
// price null on a third of them to keep the "unpriced excluded" decision visible in the demo
const POOL = (() => {
  const items = [];
  let n = 1;
  CATEGORIES.forEach(cat => {
    for (let i=0;i<5;i++){
      const priced = Math.random() > 0.32;
      items.push({
        code: `PT-${cat.key.slice(0,2).toUpperCase()}${String(n++).padStart(2,'0')}`,
        category: cat.key,
        kind: cat.kind,
        price: priced ? Math.round((150 + Math.random()*2400)/10)*10 : null,
      });
    }
  });
  return items;
})();
function thb(n){ return n.toLocaleString('th-TH'); }

// ---------------------------------------------------------------- variant state (shared shape)
let state = { size:null, budgetMin:0, budgetMax:5000, budgetSingle:0, categories:new Set(), step:0, convoStage:0 };

function filteredPool(){
  if (state.categories.size === 0) return [];
  const lo = state.budgetMin ?? 0, hi = (getVariant()==='b') ? state.budgetMax : state.budgetSingle;
  return POOL.filter(p => p.price != null && p.price >= lo && p.price <= hi && state.categories.has(p.category));
}

function forwardStrip(){
  const matched = filteredPool();
  return `
    <div class="card" style="margin-top:var(--space-6);border-color:var(--fill-success)">
      <span class="panel-title" style="color:var(--text-success)">ต่อเข้า “Auto ตามโทน” →</span>
      <p class="hint" style="margin:6px 0 var(--space-3)">งบ + แนวที่เลือกกรอง pool เหลือของที่เข้าเงื่อนไข <b style="color:var(--text-primary)">${matched.length} ชิ้น</b> จาก ${POOL.length} ชิ้นในตัวอย่างนี้ (ของที่ไม่มีราคาถูกตัดออกตามที่ตกลงไว้) — ขั้นถัดไปเลือกโทนสีต่อในโหมด Auto เดิม</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${matched.slice(0,10).map(p => `
          <div style="width:48px;text-align:center">
            <div style="width:48px;height:48px;border-radius:8px;border:1px solid var(--border);background:var(--surface-0);display:flex;align-items:center;justify-content:center">${icon(p.kind,'var(--text-primary)',22)}</div>
            <div style="font-size:9px;color:var(--text-muted);font-family:var(--font-body-en);margin-top:2px">฿${thb(p.price)}</div>
          </div>`).join('') || '<span class="hint">— ไม่มีของที่เข้าเงื่อนไข ดู ticket #4 (pool ว่าง) —</span>'}
      </div>
    </div>`;
}

// ============================================================ VARIANT A — stepper
function renderA(){
  const steps = ['ไซส์ต้น','งบประมาณ','แนว'];
  const s = state.step;
  const progress = `
    <div class="stepper-progress">
      ${steps.map((label,i) => `
        <div class="seg ${i<s?'done':''} ${i===s?'current':''}">
          <div class="dot">${i<s?'✓':i+1}</div>
          <div class="seg-label">${label}</div>
        </div>`).join('')}
    </div>`;

  let body = '';
  if (s === 0){
    body = `
      <h2>ต้นสูงเท่าไหร่</h2>
      <p class="hint">เลือกขนาดต้นคริสต์มาสจริงที่ลูกค้าจะใช้</p>
      <div class="chip-select">
        ${SIZES.map(sz => `<button aria-pressed="${state.size===sz.key}" onclick="pickA_size('${sz.key}')">${sz.label}<span class="hint">(${sz.mm} มม.)</span></button>`).join('')}
      </div>`;
  } else if (s === 1){
    body = `
      <h2>งบประมาณเท่าไหร่</h2>
      <p class="hint">เลือกไว หรือพิมพ์เอง</p>
      <div class="chip-select">
        ${[3000,5000,10000,20000].map(v => `<button aria-pressed="${state.budgetSingle===v}" onclick="pickA_budget(${v})">฿${thb(v)}</button>`).join('')}
      </div>
      <div style="margin-top:var(--space-3)">
        <input class="input" type="number" placeholder="หรือพิมพ์งบเอง (บาท)" style="width:200px;text-align:center" value="${[3000,5000,10000,20000].includes(state.budgetSingle)?'':state.budgetSingle}" oninput="pickA_budget(parseInt(this.value)||0)">
      </div>`;
  } else {
    body = `
      <h2>เน้นแนวไหน</h2>
      <p class="hint">เลือกได้ 1 แนวหลัก</p>
      <div class="chip-select">
        ${CATEGORIES.map(c => `<button aria-pressed="${state.categories.has(c.key)}" onclick="pickA_cat('${c.key}')">${icon(c.kind,'currentColor')}${c.label}</button>`).join('')}
      </div>`;
  }

  const canNext = (s===0 && state.size) || (s===1 && state.budgetSingle>0) || (s===2 && state.categories.size>0);
  const nav = `
    <div class="stepper-nav">
      <button class="btn" onclick="navA(-1)" ${s===0?'disabled':''}>← ย้อนกลับ</button>
      <button class="btn primary" onclick="navA(1)" ${canNext?'':'disabled'}>${s<2?'ถัดไป →':'ยืนยัน แล้วไปต่อ →'}</button>
    </div>`;

  document.getElementById('page-root').innerHTML = `
    ${progress}
    <div class="card stepper-card">${body}</div>
    ${nav}
    ${s===2 && state.categories.size>0 ? forwardStrip() : ''}
  `;
}
function pickA_size(k){ state.size = k; renderA(); }
function pickA_budget(v){ state.budgetSingle = v; renderA(); }
function pickA_cat(k){ state.categories.clear(); state.categories.add(k); renderA(); }
function navA(dir){ state.step = Math.max(0, Math.min(2, state.step+dir)); renderA(); }

// ============================================================ VARIANT B — single filter panel
function renderB(){
  const matched = filteredPool();
  document.getElementById('page-root').innerHTML = `
    <span class="panel-title">ตั้งเงื่อนไขแพ็กเกจ</span>
    <p class="hint" style="margin:4px 0 var(--space-4)">ปรับได้พร้อมกันทั้งหมด ผลลัพธ์อัปเดตสด ไม่มีขั้นตอนแยก</p>
    <div class="panel-grid">
      <div class="card">
        <div class="filter-field">
          <label>ไซส์ต้น</label>
          <select class="input" onchange="setB_size(this.value)">
            <option value="">— เลือก —</option>
            ${SIZES.map(sz => `<option value="${sz.key}" ${state.size===sz.key?'selected':''}>${sz.label} (${sz.mm} มม.)</option>`).join('')}
          </select>
        </div>
        <div class="filter-field">
          <label>งบประมาณ (บาท)</label>
          <div class="range-row">
            <input class="input" type="number" value="${state.budgetMin}" oninput="setB_budget(this.value,null)"> ถึง
            <input class="input" type="number" value="${state.budgetMax}" oninput="setB_budget(null,this.value)">
          </div>
        </div>
        <div class="filter-field">
          <label>แนว (เลือกได้หลายแบบ)</label>
          <div class="checkbox-grid">
            ${CATEGORIES.map(c => `
              <label class="checkbox-chip ${state.categories.has(c.key)?'checked':''}">
                <input type="checkbox" style="margin:0" ${state.categories.has(c.key)?'checked':''} onchange="toggleB_cat('${c.key}')">
                ${c.label}
              </label>`).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <span class="hint">ของที่ตรงเงื่อนไขตอนนี้</span>
        <div class="live-count">${matched.length}<span style="font-size:16px;color:var(--text-muted)"> / ${POOL.length} ชิ้น</span></div>
        <div class="result-grid">
          ${matched.map(p => `
            <div class="result-item">
              <div class="box">${icon(p.kind,'var(--text-primary)',26)}</div>
              <span class="price">฿${thb(p.price)}</span>
            </div>`).join('') || '<span class="hint">ยังไม่เข้าเงื่อนไขไหนเลย</span>'}
        </div>
      </div>
    </div>
    ${state.size && state.categories.size>0 ? forwardStrip() : ''}
  `;
}
function setB_size(v){ state.size=v||null; renderB(); }
function setB_budget(min,max){ if(min!=null) state.budgetMin=parseInt(min)||0; if(max!=null) state.budgetMax=parseInt(max)||0; renderB(); }
function toggleB_cat(k){ state.categories.has(k) ? state.categories.delete(k) : state.categories.add(k); renderB(); }

// ============================================================ VARIANT C — conversational
const CONVO_QUESTIONS = [
  {key:'size', text:'สวัสดีค่ะ ต้นสูงเท่าไหร่คะ'},
  {key:'budget', text:'งบประมาณเท่าไหร่คะ (บาท)'},
  {key:'category', text:'อยากเน้นแนวไหนคะ เลือกได้มากกว่า 1'},
];
function renderC(){
  const stage = state.convoStage;
  let thread = '';
  for (let i=0;i<=stage && i<CONVO_QUESTIONS.length;i++){
    thread += `<div class="bubble assistant">${CONVO_QUESTIONS[i].text}</div>`;
    if (i===0 && state.size) thread += `<div class="bubble user">${SIZES.find(s=>s.key===state.size).label}</div>`;
    if (i===1 && state.budgetSingle) thread += `<div class="bubble user">฿${thb(state.budgetSingle)}</div>`;
    if (i===2 && state.categories.size>0) thread += `<div class="bubble user">${[...state.categories].map(k=>CATEGORIES.find(c=>c.key===k).label).join(', ')}</div>`;
  }
  if (stage >= CONVO_QUESTIONS.length){
    thread += `<div class="bubble assistant">ครบแล้วค่ะ — งบ+แนวที่เลือกกรอง catalogue ให้แล้ว ไปเลือกโทนสีต่อในโหมด Auto ได้เลย</div>`;
  }

  let inputArea = '';
  if (stage === 0){
    inputArea = `<div class="convo-input-row"><div class="chip-select">${SIZES.map(sz=>`<button onclick="pickC_size('${sz.key}')">${sz.label}</button>`).join('')}</div></div>`;
  } else if (stage === 1){
    inputArea = `<div class="convo-input-row">
      <input class="input" type="number" placeholder="พิมพ์งบ แล้ว Enter" style="flex:1" onkeydown="if(event.key==='Enter')pickC_budget(this.value)">
    </div>`;
  } else if (stage === 2){
    inputArea = `<div class="convo-input-row"><div class="chip-select">
      ${CATEGORIES.map(c=>`<button aria-pressed="${state.categories.has(c.key)}" onclick="toggleC_cat('${c.key}')">${icon(c.kind,'currentColor')}${c.label}</button>`).join('')}
      </div></div>
      <div class="btn-row" style="margin-top:8px"><button class="btn primary" onclick="pickC_done()" ${state.categories.size>0?'':'disabled'}>พอแล้ว ไปต่อ →</button></div>`;
  }

  document.getElementById('page-root').innerHTML = `
    <span class="panel-title">คุยกับผู้ช่วยจัดแพ็กเกจ</span>
    <div class="convo-grid" style="margin-top:var(--space-4)">
      <div class="card">
        <div class="convo-thread">${thread}</div>
        ${inputArea}
      </div>
      <div class="card receipt">
        <span class="hint">ใบสรุป</span>
        <div class="receipt-row"><span>ไซส์ต้น</span><span class="v ${state.size?'':'pending'}">${state.size ? SIZES.find(s=>s.key===state.size).label : 'ยังไม่ตอบ'}</span></div>
        <div class="receipt-row"><span>งบ</span><span class="v ${state.budgetSingle?'':'pending'}">${state.budgetSingle ? '฿'+thb(state.budgetSingle) : 'ยังไม่ตอบ'}</span></div>
        <div class="receipt-row"><span>แนว</span><span class="v ${state.categories.size?'':'pending'}">${state.categories.size ? [...state.categories].map(k=>CATEGORIES.find(c=>c.key===k).label).join(', ') : 'ยังไม่ตอบ'}</span></div>
      </div>
    </div>
    ${stage>=CONVO_QUESTIONS.length ? forwardStrip() : ''}
  `;
}
function pickC_size(k){ state.size=k; state.convoStage=1; renderC(); }
function pickC_budget(v){ const n=parseInt(v)||0; if(n<=0) return; state.budgetSingle=n; state.convoStage=2; renderC(); }
function toggleC_cat(k){ state.categories.has(k) ? state.categories.delete(k) : state.categories.add(k); renderC(); }
function pickC_done(){ state.convoStage=3; renderC(); }

// ---------------------------------------------------------------- switcher / variant plumbing
const VARIANTS = {
  a: {name:'ทีละขั้น (stepper)', render:renderA},
  b: {name:'แผงเดียว กรองสด (single panel)', render:renderB},
  c: {name:'ผู้ช่วยสนทนา (conversational)', render:renderC},
};
const ORDER = ['a','b','c'];
function getVariant(){
  const v = new URLSearchParams(location.search).get('variant');
  return VARIANTS[v] ? v : 'a';
}
function resetState(){ state = { size:null, budgetMin:0, budgetMax:5000, budgetSingle:0, categories:new Set(), step:0, convoStage:0 }; }
function renderSwitcher(){
  const v = getVariant();
  document.getElementById('switcher').innerHTML = `
    <button onclick="cycle(-1)" aria-label="ก่อนหน้า">←</button>
    <span class="label">${v.toUpperCase()} — ${VARIANTS[v].name}<small>ticket #3 prototype · ${ORDER.indexOf(v)+1}/${ORDER.length}</small></span>
    <button onclick="cycle(1)" aria-label="ถัดไป">→</button>
  `;
  document.getElementById('variant-caption').textContent = `PROTOTYPE variant ${v.toUpperCase()}`;
}
function cycle(dir){
  const i = ORDER.indexOf(getVariant());
  const next = ORDER[(i + dir + ORDER.length) % ORDER.length];
  const url = new URL(location);
  url.searchParams.set('variant', next);
  history.replaceState(null, '', url);
  resetState();
  render();
}
function render(){
  renderSwitcher();
  VARIANTS[getVariant()].render();
}
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase();
  if (tag==='input' || tag==='textarea' || e.target.isContentEditable) return;
  if (e.key==='ArrowLeft') cycle(-1);
  if (e.key==='ArrowRight') cycle(1);
});
render();
</script>
