<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Decorator — ประวัติ</title>
<link rel="icon" href="/static/icon.ico">
<link rel="stylesheet" href="/static/styles/tokens.css?v=8.43">
<link rel="stylesheet" href="/static/styles/components.css?v=8.43">
<script src="/static/theme.js?v=8.43"></script>
<script src="/static/sidebar.js?v=8.43"></script>
</head>
<body>

<header class="topbar">
  <span class="logo">Tree Decorator</span>
  <span class="spacer"></span>
  <div class="tile">
    <span class="k caption">สร้างไปแล้ว</span>
    <span class="v" id="generations">–</span>
  </div>
  <div class="tile">
    <span class="k caption">token ที่ใช้</span>
    <span class="v" id="tokens">–</span>
  </div>
</header>

<div class="frame">
  <nav class="sidebar">
    <button type="button" class="row" id="sidebar-toggle">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></span>
      ย่อเมนู
    </button>
    <a class="row" href="/" title="หน้าแรก">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
      หน้าแรก
    </a>
    <a class="row" href="/identify" title="หาสินค้าจากรูป">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg></span>
      หาสินค้าจากรูป
    </a>
    <a class="row active" href="/history" title="ประวัติ">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
      ประวัติ
    </a>
    <a class="row" href="/pricing" title="ตั้งราคา">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.82 0l4.6-4.6a2 2 0 0 0 0-2.82z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
      ตั้งราคา
    </a>
    <a class="row" href="/settings" title="ตั้งค่า">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      ตั้งค่า
    </a>
  </nav>

  <main class="page">
    <section class="card stack">
      <span class="section-title">ภาพที่สร้างทั้งหมด เรียงใหม่สุดก่อน</span>
      <span class="hint">ภาพที่สร้างสำเร็จแต่ไม่ขึ้นบนหน้าจอ ยังโหลดได้จากตรงนี้</span>
      <div class="notice" id="error-box" hidden></div>
      <div class="scroll-x wide">
      <table>
        <thead>
          <tr>
            <th class="caption">รูป</th>
            <th class="caption" style="text-align: center">เมื่อไหร่ (เวลาไทย)</th>
            <th class="caption">request</th>
            <th class="caption">ขนาด</th>
            <th class="caption">รายการ</th>
            <th class="caption" style="text-align: center">ราคา</th>
            <th class="caption">สถานะ</th>
            <th class="caption">token</th>
            <th class="caption">ผลลัพธ์</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      </div>
      <span class="hint" id="empty" hidden>ยังไม่เคยสร้างภาพ</span>
    </section>
  </main>
</div>

<!-- Full-size look at a finished picture, so a row can be checked without downloading it. -->
<dialog id="lightbox-dialog" class="lightbox-dialog">
  <button class="btn danger" id="lightbox-close">ปิด</button>
  <img id="lightbox-image" alt="">
</dialog>

<script src="/static/api.js?v=8.43"></script>
<script src="/static/history.js?v=8.43"></script>
</body>
</html>
